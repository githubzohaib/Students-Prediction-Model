services:
  - type: web
    name: student-prediction-api
    runtime: python
    plan: free
    rootDir: server
    # The --lite artifacts (~3.7MB) are committed under model/artifacts/, so a
    # deploy only has to install dependencies. This deliberately matches the
    # default build command: the service works without any dashboard change.
    #
    # To build the models fresh instead of shipping them, append:
    #     && python model/train_model.py --lite
    # Do not drop --lite on the free plan -- full-depth ensembles need ~186MB
    # of tree nodes once loaded, against a 512MB cap.
    buildCommand: pip install --no-cache-dir -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: FRONTEND_URL
        value: https://students-prediction-model.vercel.app
